{% extends 'social_media.html' %}
{% block title %} User Dashboard {% endblock title %}
{% block content %}
<style>
    body {
        background-color: #059efd;
    }
    .dashboard-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #1391e0;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .dashboard-container h1,
    .dashboard-container h2 {
        text-align: center;
    }
    .posts-list {
        list-style-type: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .post-item {
        padding: 20px;
        background-color: #08e6af;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .post-item a {
        font-weight: bold;
        color: #007bff;
        text-decoration: none;
    }
    .post-item a:hover {
        text-decoration: underline;
    }
    .post-item p {
        margin: 10px 0 0;
    }
    .action-buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }
    .action-buttons button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
    }
    .action-buttons button:hover {
        background-color: #0056b3;
    }
    .action-buttons .delete-button {
        background-color: #dc3545;
    }
    .action-buttons .delete-button:hover {
        background-color: #c82333;
    }
</style>

<div class="dashboard-container">
    <h1>Welcome, {{ user.username }}</h1>
    <h2>Your Posts</h2>
    <ul class="posts-list">
        {% for post in posts %}
        <li class="post-item">
            <a href="{% url 'single_post' post.id %}">{{ post.title }}</a>
            <p>{{ post.content }}</p>
            <div class="action-buttons">
                <button onclick="window.location.href='{% url 'update_post' post.id %}'">Update</button>
                <button class="delete-button" onclick="window.location.href='{% url 'delete_post' post.id %}'">Delete</button>
            </div>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock content %}
