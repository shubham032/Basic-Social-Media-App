{% extends 'social_media.html' %}
{% block title %} Create Post {% endblock title %}
{% block content %}
<style>
    body {
        background-color: #059efd;
    }
    .create-post-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color:#08e6af;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .create-post-form label {
        font-weight: bold;
    }
    .create-post-form input[type="text"],
    .create-post-form textarea,
    .create-post-form select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .create-post-form button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
    }
    .create-post-form button:hover {
        background-color: #0056b3;
    }
</style>

<h1>Create a New Post</h1>
<form method="POST" action="{% url 'create_post' %}" class="create-post-form">
    {% csrf_token %}
    <label for="title">Title</label>
    <input type="text" name="title" required>
    <label for="content">Content</label>
    <textarea name="content" required></textarea>
    <label for="category">Category</label>
    <select name="category" required>
        {% for category in categories %}
        <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
    </select>
    <button type="submit">Create Post</button>
</form>
{% endblock content %}
